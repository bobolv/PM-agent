[project]
name = "pm-agent"
version = "0.1.0"
description = "Project lifecycle document generation and management platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "sqlmodel>=0.0.21",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
pm-agent = "pm_agent.main:main"
pm-agent-api = "pm_agent.api.main:run"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
