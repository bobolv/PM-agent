services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pm_agent
      POSTGRES_USER: pm_agent
      POSTGRES_PASSWORD: pm_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm_agent -d pm_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://pm_agent:pm_agent@db:5432/pm_agent
      DOCUMENT_STORAGE_PATH: /app/data/documents
      LLM_PROVIDER: openai
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_MODEL: gpt-4.1-mini
      LLM_TEMPERATURE: "0.2"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - document_data:/app/data/documents
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  document_data:
